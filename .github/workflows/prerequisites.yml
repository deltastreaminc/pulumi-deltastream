name: Prerequisites

on:
  workflow_call:
    inputs:
      is_pr:
        type: boolean
        required: true
      default_branch:
        type: string
        required: true
    outputs:
      version:
        description: "Provider version being built"
        value: ${{ jobs.prerequisites.outputs.version }}

jobs:
  prerequisites:
    name: prerequisites
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      version: ${{ steps.provider-version.outputs.version }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch full history so provider-version-action can compute the version from tags
          fetch-depth: 0

      - name: Calculate provider version
        id: provider-version
        uses: pulumi/provider-version-action@v2
        with:
          set-env: PROVIDER_VERSION

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        env:
          MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 30s
        with:
          version: 2026.6.14
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache_save: true

      - name: Setup Go module cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: go.sum

      - name: Build provider binary
        run: make provider
        env:
          PROVIDER_VERSION: ${{ steps.provider-version.outputs.version }}

      - name: Run provider unit tests
        run: make test_provider

      - name: Generate schema
        run: make schema
        env:
          PROVIDER_VERSION: ${{ steps.provider-version.outputs.version }}

      - name: Check schema diff on PR
        if: inputs.is_pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "SCHEMA_CHANGES<<$EOF"
            LAST=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "NONE")
            if [ "$LAST" != "NONE" ]; then
              # schema-tools compare --old-commit always fetches from the hardcoded
              # provider/cmd/pulumi-resource-deltastream/schema.json path. That path only
              # exists from #61 (2026-07-01) onward; releases at or before v0.4.3 still have
              # schema.json at the repo root. Probe both locations so the diff keeps working
              # for old-commit refs from either side of that move. Kept in sync with the
              # equivalent step in publish.yml.
              OLD_SCHEMA=""
              for candidate in \
                "provider/cmd/pulumi-resource-deltastream/schema.json" \
                "schema.json"; do
                if gh api -H "Accept: application/vnd.github.raw" \
                     "repos/${{ github.repository }}/contents/${candidate}?ref=${LAST}" \
                     > old-schema.json 2>/dev/null; then
                  OLD_SCHEMA="old-schema.json"
                  break
                fi
              done
              if [ -n "$OLD_SCHEMA" ]; then
                if ! schema-tools compare \
                       --provider deltastream \
                       --old-path "$OLD_SCHEMA" \
                       --new-path provider/cmd/pulumi-resource-deltastream/schema.json; then
                  echo "_Schema diff unavailable: \`schema-tools compare\` failed against previous release \`$LAST\`._"
                fi
              else
                echo "_Schema diff unavailable: could not fetch schema.json for previous release \`$LAST\`._"
              fi
            else
              echo "No previous release found; skipping schema diff."
            fi
            echo "$EOF"
          } >> "$GITHUB_ENV"

      - name: Comment schema diff on PR
        if: inputs.is_pr
        uses: thollander/actions-comment-pull-request@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-tag: schemaCheck
          message: |
            **Schema diff vs last release:**

            ${{ env.SCHEMA_CHANGES }}

      - name: Upload provider binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-bin
          path: bin/pulumi-resource-deltastream
          retention-days: 7

      - name: Upload schema artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schema.json
          path: provider/cmd/pulumi-resource-deltastream/schema.json
          retention-days: 7
